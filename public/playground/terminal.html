<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSSL Terminal</title>
  <script src="../wasm/xterm.js"></script>
  <link rel="stylesheet" href="../wasm/xterm.css" />
  <script src="../wasm/xterm-addon-fit.js"></script>
  <script src="../wasm/webterm.bundle.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0d1117; overflow: hidden; }
    #terminal {
      width: 100%;
      height: 100%;
      padding: 4px;
    }
    .xterm { height: 100%; }
    .xterm-viewport { overflow-y: hidden !important; }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <script>
    (function () {
      'use strict';

      function notifyParent(msg) {
        try { window.parent.postMessage(msg, '*'); } catch (e) {}
      }

      // ── Terminal ──────────────────────────────────────────────────────────
      var term = new Terminal({
        cursorBlink: true,
        fontSize: 13,
        fontFamily: "'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace",
        theme: {
          background:   '#0d1117',
          foreground:   '#e6edf3',
          cursor:       '#58a6ff',
          black:        '#484f58',
          red:          '#ff7b72',
          green:        '#3fb950',
          yellow:       '#d29922',
          blue:         '#58a6ff',
          magenta:      '#bc8cff',
          cyan:         '#39c5cf',
          white:        '#b1bac4',
          brightBlack:  '#6e7681',
          brightRed:    '#ffa198',
          brightGreen:  '#56d364',
          brightYellow: '#e3b341',
          brightBlue:   '#79c0ff',
          brightMagenta:'#d2a8ff',
          brightCyan:   '#56d4dd',
          brightWhite:  '#f0f6fc',
        },
        scrollback: 5000,
        allowProposedApi: true,
      });

      var fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      // ── Capture output by patching term.write ─────────────────────────────
      // Reading the xterm buffer after the fact is unreliable (length is fixed,
      // baseY+cursorY shifts, circular wrapping). Intercepting write() gives us
      // the exact bytes sent to the terminal during command execution.
      var _capturing = false;
      var _capturedData = '';
      var _origWrite = term.write.bind(term);
      term.write = function (data, callback) {
        if (_capturing) {
          if (typeof data === 'string') _capturedData += data;
          else if (data instanceof Uint8Array) _capturedData += new TextDecoder().decode(data);
        }
        return _origWrite(data, callback);
      };

      // ── WasmWebTerm ───────────────────────────────────────────────────────
      var wasmWebTerm = new WasmWebTerm.default('../wasm/');

      // Fires once when the addon fully activates and prints its first prompt
      wasmWebTerm.onActivated = function () {
        notifyParent({ type: 'ready' });
      };

      // Fires right before command execution — start capturing
      wasmWebTerm.onBeforeCommandRun = function () {
        _capturedData = '';
        _capturing = true;
      };

      // Fires after every command finishes — process captured stream
      wasmWebTerm.onCommandRunFinish = function () {
        _capturing = false;
        var output = _processCapture(_capturedData);
        notifyParent({ type: 'commandDone', output: output });
      };

      // Fires whenever the in-memory FS changes (unused, kept for compatibility)
      wasmWebTerm.onFileSystemUpdate = function () {};

      term.loadAddon(wasmWebTerm);
      term.open(document.getElementById('terminal'));

      setTimeout(function () { fitAddon.fit(); }, 50);
      window.addEventListener('resize', function () { fitAddon.fit(); });

      // ── Helpers ───────────────────────────────────────────────────────────

      // Process the raw write-captured data: strip ANSI, extract PEM block(s)
      function _processCapture(raw) {
        try {
          // Normalise line endings
          raw = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          // Strip all ANSI / VT escape sequences
          raw = raw.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '');
          raw = raw.replace(/\x1b\][^\x07]*\x07/g, '');
          raw = raw.replace(/\x1b[()][AB012]/g, '');
          raw = raw.replace(/\x1b[=>]/g, '');
          // Strip backspace sequences (local-echo editing artefacts)
          var safety = 0;
          while (/[^\x08]\x08/.test(raw) && ++safety < 200) {
            raw = raw.replace(/[^\x08]\x08/g, '');
          }
          raw = raw.replace(/^\x08+/, '');
          // Strip other control characters except newline/tab
          raw = raw.replace(/[\x00-\x09\x0b-\x1f\x7f]/g, '');

          // ── PEM extraction ─────────────────────────────────────────────
          // Use regex to pull out every -----BEGIN...-----END block.
          // This is immune to progress dots, prompts, and any other garbage.
          // Pattern: "-----BEGIN " + type (no dashes) + "-----"
          // Note: [^-]+ consumes the type name + trailing space, then "-----"
          // matches the 5 closing dashes exactly. Avoid [^\-]+-+----- which
          // requires 6+ closing dashes and never matches standard PEM headers.
          var pemRegex = /-----BEGIN [^-]+-----[\s\S]*?-----END [^-]+-----/g;
          var pems = raw.match(pemRegex);
          if (pems && pems.length > 0) {
            return pems.join('\n').trim();
          }

          // ── Non-PEM output (hash, version, random…) ────────────────────
          // Strip the first line (echoed command) and trailing prompt.
          var lines = raw.split('\n');
          lines = lines.slice(1);                         // remove echoed command
          while (lines.length && /[$#>]\s*$/.test(lines[lines.length - 1])) {
            lines.pop();                                  // remove prompt line(s)
          }
          return lines.join('\n').trim();
        } catch (e) {
          return '';
        }
      }

      // ── postMessage bridge ────────────────────────────────────────────────
      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || typeof data !== 'object') return;

        if (data.type === 'runCommand' && typeof data.command === 'string') {
          // Inject through xterm's data path so the local-echo addon (the REPL's
          // readline) receives the text + Enter exactly as if the user typed it.
          // Do NOT call wasmWebTerm.runLine() directly — that races against the
          // REPL's blocking local-echo.read() call and causes a hang.
          term.paste(data.command + '\r');
        }

        if (data.type === 'clearTerminal') {
          term.clear();
        }
      });
    })();
  </script>
</body>
</html>
