# Serves a built microfrontend. The image keeps the files under /ui/modules/<name>/ so the same
# path works behind the ingress without rewrites (remoteEntry.js at /ui/modules/<name>/remoteEntry.js).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server {
        listen 8085 default_server;
        root /var/www/html;

        # The entry file is not content-hashed: clients must always revalidate it.
        location ~ /remoteEntry\.js$ {
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";
            try_files $uri =404;
        }

        # Everything else a build emits is content-hashed.
        location ~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
            try_files $uri =404;
        }

        location / {
            try_files $uri =404;
        }
    }
}
