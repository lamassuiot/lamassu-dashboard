name: Finalize Release

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - CHANGELOG.md
      - RELEASE-NOTES.md

jobs:
  detect-release:
    name: Verify release preparation merge
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      release_version: ${{ steps.detect.outputs.release_version }}
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Detect prepared release
        id: detect
        run: |
          current_version=$(node -p 'require("./package.json").version')
          previous_version=$(git show "$GITHUB_SHA^:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "No package version change; skipping release finalization."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release package version must be stable semantic version X.Y.Z"
            exit 1
          fi

          if ! grep -Fq "## [$current_version]" CHANGELOG.md || ! grep -Fq "## [$current_version]" RELEASE-NOTES.md; then
            echo "::error::Generated changelog and release notes must both contain version $current_version"
            exit 1
          fi

          if git tag --list "$current_version" | grep -Fxq "$current_version"; then
            echo "::error::Release tag $current_version already exists"
            exit 1
          fi

          echo "release_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build release image (${{ matrix.arch }})
    needs: detect-release
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture builds natively on its own runner and is pushed by
      # digest only; publish-release stitches the digests into a multi-arch tag.
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/lamassuiot/lamassu-ui,push-by-digest=true,name-canonical=true,push=true
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Build and publish release artifacts
    needs: [detect-release, build-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      image-digest: ${{ steps.merge-image.outputs.digest }}
    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies and build static site
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          if [[ ! -d out ]]; then
            echo "::error::Build did not produce the expected out directory"
            exit 1
          fi
          zip -r release.zip out

      - name: Generate SPDX SBOM from pnpm lockfile
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ./pnpm-lock.yaml
          format: spdx-json
          output-file: lamassu-ui-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image
        id: merge-image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/lamassuiot/lamassu-ui
          VERSION: ${{ needs.detect-release.outputs.release_version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with tag and assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.detect-release.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ needs.detect-release.outputs.release_version }}
          body_path: RELEASE-NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release.zip
            lamassu-ui-sbom.spdx.json

  scan-image:
    name: Scan release image
    needs: publish-release
    uses: ./.github/workflows/trivy-image-scan.yml
    with:
      image-ref: ghcr.io/lamassuiot/lamassu-ui@${{ needs.publish-release.outputs.image-digest }}
      category: trivy-image-release
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
