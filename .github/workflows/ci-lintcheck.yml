name: CI Lint Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      
jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        id: lint
        run: |
          set +e
          OUTPUT=$(npm run lint 2>&1)
          EXIT_CODE=$?
          
          # Print the full output so users can see all errors/warnings
          echo "$OUTPUT"
          
          # Count ESLint errors and warnings by counting lines with "Error:" and "Warning:"
          ERROR_COUNT=$(echo "$OUTPUT" | grep -c "  Error: " || echo "0")
          WARNING_COUNT=$(echo "$OUTPUT" | grep -c "  Warning: " || echo "0")
          
          # Calculate total issues
          TOTAL_ISSUES=$((ERROR_COUNT + WARNING_COUNT))
          
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "warning_count=$WARNING_COUNT" >> $GITHUB_OUTPUT
          echo "total_issues=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
          echo ""
          echo "========================================"
          echo "ESLint Check Summary"
          echo "========================================"
          echo "Errors:   $ERROR_COUNT"
          echo "Warnings: $WARNING_COUNT"
          echo "Total:    $TOTAL_ISSUES"
          echo "========================================"
          
          if [ "$TOTAL_ISSUES" -gt 0 ]; then
            echo "❌ Lint check failed with $TOTAL_ISSUES issue(s)"
            exit 1
          else
            echo "✅ Lint check passed with no issues"
            exit 0
          fi