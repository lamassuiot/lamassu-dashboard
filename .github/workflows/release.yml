name: "Release Workflow"

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        description: release version when building docker containers (example; 2.0.0)

run-name: >-
  ${{ format('Release {0}', github.event.inputs.release_version) }}
        
jobs:
  build_image:
    name: Build docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
    - name: Login to Github Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    # Each architecture builds natively on its own runner and is pushed by
    # digest only; the publish job stitches the digests into a multi-arch tag.
    - name: Build Docker image
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        platforms: ${{ matrix.platform }}
        build-args: |
          SHA1VER=${{ env.SHA1VER }}
          VERSION=${{ github.event.inputs.release_version }}
        outputs: type=image,name=ghcr.io/lamassuiot/lamassu-ui,push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "${RUNNER_TEMP}/digests"
        touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  build_aws_connector_docker_image:
    name: Release docker images
    needs: build_image
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
    - name: Download digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true

    - name: Login to Github Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Create multi-arch manifest
      working-directory: ${{ runner.temp }}/digests
      env:
        IMAGE: ghcr.io/lamassuiot/lamassu-ui
        RELEASE_VERSION: ${{ github.event.inputs.release_version }}
      run: |
        docker buildx imagetools create \
          -t "${IMAGE}:${RELEASE_VERSION}" \
          -t "${IMAGE}:latest" \
          $(printf "${IMAGE}@sha256:%s " *)

    - name: Inspect manifest
      env:
        IMAGE: ghcr.io/lamassuiot/lamassu-ui
        RELEASE_VERSION: ${{ github.event.inputs.release_version }}
      run: docker buildx imagetools inspect "${IMAGE}:${RELEASE_VERSION}"

    - name: Create tag
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: 'refs/tags/${{ github.event.inputs.release_version }}',
            sha: context.sha
          })

    - name: Generate Release Changelog
      id: changelog
      uses: mikepenz/release-changelog-builder-action@c9dc8369bccbc41e0ac887f8fd674f5925d315f7 # v5
      with:
        configuration: '.github/changelog-configuration.json'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      id: create_release
      uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.release_version }}
        release_name: Release v${{ github.event.inputs.release_version }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: false

    - name: Build project
      run: npm ci && npm run build

    - name: Zip out folder
      run: |
        if [ -d "out" ]; then
          zip -r release.zip out
        else
          echo "No out folder found to zip."
        fi

    - name: Upload Release Asset
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
      if: success()
      with:
        tag_name: ${{ github.event.inputs.release_version }}
        files: release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}