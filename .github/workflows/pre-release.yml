name: "Pre-Release Workflow"

permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        description: pre-release version when building docker containers (example; 2.0.0-beta.1)

run-name: >-
  ${{ format('Pre-Release {0}', github.event.inputs.release_version) }}
        
jobs:
  pre-release:
    name: Pre-Release Docker Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps: 
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Validate release version
      id: validate-version
      env:
        RELEASE_VERSION: ${{ github.event.inputs.release_version }}
      run: |
        if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Release version must be a semantic version without a v prefix"
          exit 1
        fi
        echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

    - name: Find previous stable release
      id: release-range
      run: |
        previous_tag=$(git tag --merged "$GITHUB_SHA" --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
        if [[ -n "$previous_tag" ]]; then
          echo "range=$previous_tag..$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        fi

    - name: Generate Release Changelog
      id: changelog
      uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
      with:
        version: v2.14.1
        config: cliff.toml
        args: >-
          ${{ steps.release-range.outputs.range }} --tag ${{ steps.validate-version.outputs.release_version }} --strip header
      env:
        GITHUB_REPO: ${{ github.repository }}

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26'
        cache: pnpm

    - name: Build project
      run: |
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm run build

    - name: Generate SPDX SBOM from pnpm lockfile
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        file: ./pnpm-lock.yaml
        format: spdx-json
        output-file: lamassu-ui-sbom.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Zip out folder
      run: |
        if [ -d "out" ]; then
          zip -r release.zip out
        else
          echo "No out folder found to zip."
        fi

    - name: Create Pre-Release with tag and assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.validate-version.outputs.release_version }}
        target_commitish: ${{ github.sha }}
        name: Pre-Release v${{ steps.validate-version.outputs.release_version }}
        body: ${{ steps.changelog.outputs.content }}
        draft: false
        prerelease: true
        make_latest: false
        files: |
          release.zip
          lamassu-ui-sbom.spdx.json
