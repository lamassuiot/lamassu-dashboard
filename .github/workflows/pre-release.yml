name: "Pre-Release Workflow"

permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        description: pre-release version when building docker containers (example; 2.0.0-beta.1)

run-name: >-
  ${{ format('Pre-Release {0}', github.event.inputs.release_version) }}
        
jobs:
  pre-release:
    name: Pre-Release Docker Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps: 
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Validate release version
      id: validate-version
      env:
        RELEASE_VERSION: ${{ github.event.inputs.release_version }}
      run: |
        if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Release version must be a semantic version without a v prefix"
          exit 1
        fi
        echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

    - name: Find previous stable release
      id: release-range
      run: |
        previous_tag=$(git tag --merged "$GITHUB_SHA" --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
        if [[ -n "$previous_tag" ]]; then
          echo "range=$previous_tag..$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        fi

    - name: Generate Release Changelog
      id: changelog
      uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
      with:
        version: v2.14.1
        config: cliff.toml
        args: >-
          ${{ steps.release-range.outputs.range }} --tag ${{ steps.validate-version.outputs.release_version }} --strip header
      env:
        GITHUB_REPO: ${{ github.repository }}

    - name: Build project
      run: npm ci && npm run build

    - name: Zip out folder
      run: |
        if [ -d "out" ]; then
          zip -r release.zip out
        else
          echo "No out folder found to zip."
        fi

    - name: Create tag
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      env:
        RELEASE_VERSION: ${{ steps.validate-version.outputs.release_version }}
      with:
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `refs/tags/${process.env.RELEASE_VERSION}`,
            sha: context.sha
          })

    - name: Create Pre-Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
      with:
        tag_name: ${{ steps.validate-version.outputs.release_version }}
        name: Pre-Release v${{ steps.validate-version.outputs.release_version }}
        body: ${{ steps.changelog.outputs.content }}
        draft: false
        prerelease: true
        files: release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
