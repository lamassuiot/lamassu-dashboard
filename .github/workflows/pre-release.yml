name: "Pre-Release Workflow"

permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        description: pre-release version when building docker containers (example; 2.0.0-beta.1)

run-name: >-
  ${{ format('Pre-Release {0}', github.event.inputs.release_version) }}
        
jobs:
  pre-release:
    name: Pre-Release Docker Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps: 
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
          
    - name: Create tag
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
      with:
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: 'refs/tags/${{ github.event.inputs.release_version }}',
            sha: context.sha
          })
    - name: Update local repo after tag creation
      run: |
        git fetch --all --tags
        git pull

    - name: Generate Release Changelog
      id: changelog
      uses: mikepenz/release-changelog-builder-action@c9dc8369bccbc41e0ac887f8fd674f5925d315f7 # v5.4.1
      with:
        configuration: '.github/changelog-configuration.json'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build project
      run: npm ci && npm run build

    - name: Zip out folder
      run: |
        if [ -d "out" ]; then
          zip -r release.zip out
        else
          echo "No out folder found to zip."
        fi

    - name: Create Pre-Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
      with:
        tag_name: ${{ github.event.inputs.release_version }}
        name: Pre-Release v${{ github.event.inputs.release_version }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: true
        files: release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
