name: CodeQL

permissions: {}

# Run workflow each time code is pushed to your repository and on a schedule.
# The scheduled workflow runs every at 00:00 on Sunday UTC time.
on:
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze JavaScript, TypeScript, and GitHub Actions
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript, actions

      - name: Analyze source
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          output: ${{ runner.temp }}/codeql-sarif
          upload: never
          upload-database: false

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: ${{ runner.temp }}/codeql-sarif
          if-no-files-found: error
          retention-days: 7

  upload-results:
    name: Upload CodeQL results
    needs: analyze
    if: ${{ needs.analyze.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codeql-sarif
          path: codeql-sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: codeql-sarif
