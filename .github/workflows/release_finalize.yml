name: Finalize Release

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'   # optional: run only when CHANGELOG.md changed
      - 'RELEASE-NOTES.md'   # optional: run only when RELEASE-NOTES.md changed

env:
  RELEASE_VERSION: ""  # Global variable to be set by extract_version job
        
jobs:
  extract_version:
    name: Extract Version from Commit Message
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.extract.outputs.release_version }}
      major_version: ${{ steps.extract.outputs.major_version }}
      release_version_with_v: ${{ steps.extract.outputs.release_version_with_v }}
      is_release_commit: ${{ steps.extract.outputs.is_release_commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from commit message
        id: extract
        run: |
          msg="$(git log -1 --pretty=%s)"
          echo "Last commit: $msg"
          
          # Check if this is a release commit
          if [[ "$msg" =~ ^chore:\ release:\ prepare\ release\ ([0-9]+\.[0-9]+\.[0-9]+).*$ ]]; then
            version="${BASH_REMATCH[1]}"
            echo "is_release_commit=true" >> $GITHUB_OUTPUT
            echo "Found release version: $version"
            
            # Validate semver format
            SEMVER_REGEX="^([0-9]+\.[0-9]+\.[0-9]+)$"
            if [[ "$version" =~ $SEMVER_REGEX ]]; then
              major=$(echo "$version" | cut -d. -f1)
              echo "release_version=$version" >> $GITHUB_OUTPUT
              echo "major_version=$major" >> $GITHUB_OUTPUT
              echo "release_version_with_v=v$version" >> $GITHUB_OUTPUT
            else
              echo "Invalid semver format: $version"
              exit 1
            fi
          else
            echo "is_release_commit=false" >> $GITHUB_OUTPUT
            echo "Not a release commit; skipping release process."
            exit 1
          fi

  build_aws_connector_docker_image:
    name: Release docker images
    needs: extract_version
    permissions: write-all
    runs-on: ubuntu-latest
    steps:        
    - name: Login to Github Registry
      uses: docker/login-action@v3
      with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        build-args: |
          SHA1VER=${{ env.SHA1VER }}
          VERSION=${{ needs.extract_version.outputs.release_version }}
        tags: |
            ghcr.io/lamassuiot/lamassu-ui:${{ needs.extract_version.outputs.release_version }}
            ghcr.io/lamassuiot/lamassu-ui:latest
        push: true
      
    - name: Create tag
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: 'refs/tags/${{ needs.extract_version.outputs.release_version }}',
            sha: context.sha
          })

    - name: Generate Release Changelog
      id: changelog
      uses: mikepenz/release-changelog-builder-action@v5
      with:
        configuration: '.github/changelog-configuration.json'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      id: create_release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.extract_version.outputs.release_version }}
        release_name: Release v${{ needs.extract_version.outputs.release_version }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: false

    - name: Build project
      run: npm ci && npm run build

    - name: Zip out folder
      run: |
        if [ -d "out" ]; then
          zip -r release.zip out
        else
          echo "No out folder found to zip."
        fi

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        tag_name: ${{ needs.extract_version.outputs.release_version }}
        files: release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}