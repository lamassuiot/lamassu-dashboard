name: Develop Workflow

permissions: {}

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (leave blank to use 'dev'). Cannot be 'latest' or start with a number."
        required: false
        default: ""

jobs:
  validate_tag:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Validate and set tag
        id: set_tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-dev}"

          if [[ "${TAG,,}" == "latest" ]]; then
            echo "Error: tag 'latest' is not allowed." >&2
            exit 1
          fi

          if ! [[ "$TAG" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,86}$ ]]; then
            echo "Error: tag must match ^[A-Za-z_][A-Za-z0-9_.-]{0,86}$ (got '$TAG')." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build_image:
    name: "Build DEV docker image (${{ matrix.arch }})"
    needs: validate_tag
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Login to Github Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Each architecture builds natively on its own runner and is pushed by
      # digest only; the merge job stitches the digests into a multi-arch tag.
      - name: Build the Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/lamassuiot/lamassu-ui,push-by-digest=true,name-canonical=true,push=true
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  dev_image:
    name: "Publish DEV multi-arch docker image"
    needs: [validate_tag, build_image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Github Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/lamassuiot/lamassu-ui
          TAG: ${{ needs.validate_tag.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${TAG}-${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect manifest
        env:
          IMAGE: ghcr.io/lamassuiot/lamassu-ui
          TAG: ${{ needs.validate_tag.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"


  scan-image:
    name: Scan DEV image
    needs: [validate_tag, dev_image]
    uses: ./.github/workflows/trivy-image-scan.yml
    with:
      image-ref: ghcr.io/lamassuiot/lamassu-ui:${{ needs.validate_tag.outputs.tag }}-${{ github.sha }}
      category: trivy-image-dev
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
