# Main nginx config for rootless execution (USER 65532:65532). Runtime paths
# live under /tmp so nginx needs no ownership-changing capabilities.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # WebSocket upgrade for the bundled Wisp server (see /wisp/ below).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8085 default_server;
        root /var/www/html;
        index index.html;

        # Wisp server bundled in the image (docker-entrypoint.sh). The browser terminal opens its
        # network through it on the dashboard's own origin. It answers 502 when the server is off.
        location /wisp/ {
            proxy_pass http://127.0.0.1:5001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri.html $uri/ /index.html =404;
        }
    }
}
