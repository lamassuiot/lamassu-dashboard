server {
    listen 80 default_server;
    root /var/www/html;
    index index.html;

    # NOTE: The /tools/playground page uses OpenSSL via WebAssembly and requires
    # SharedArrayBuffer (for WebWorker multi-threading). Browsers only expose
    # SharedArrayBuffer when the page is cross-origin isolated. To enable this in
    # production, add the following headers (globally or scoped to the /wasm/ path):
    #
    #   add_header Cross-Origin-Opener-Policy "same-origin" always;
    #   add_header Cross-Origin-Embedder-Policy "require-corp" always;
    #
    # Without these headers the WASM terminal will fall back to synchronous
    # execution on the main thread, which may temporarily freeze the browser tab.
    # The Next.js dev server already sets these headers via next.config.ts.

    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }
}

