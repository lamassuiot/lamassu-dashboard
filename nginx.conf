# Main nginx config for rootless execution (USER 65532:65532). Runtime paths
# live under /tmp so nginx needs no ownership-changing capabilities.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # /wisp/ takes the user's access token in the query string (a browser cannot set headers on a
    # WebSocket), so its access log leaves the query out (and the path is the location's: the
    # rewrite below changes $uri).
    log_format wisp_no_query '$remote_addr - $remote_user [$time_local] "$request_method /wisp/ $server_protocol" $status $body_bytes_sent "$http_user_agent"';

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # WebSocket upgrade for the bundled Wisp server (see /wisp/ below).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Browsers send Origin on WebSocket handshakes. Compare it with the public scheme
    # and Host; the trusted ingress must overwrite X-Forwarded-Proto and preserve Host.
    map $http_x_forwarded_proto $wisp_scheme {
        default $scheme;
        http http;
        https https;
    }
    map "$wisp_scheme://$http_host|$http_origin" $wisp_origin_allowed {
        default 0;
        ~*^(https?://[^|]+)\|\1$ 1;
    }

    server {
        listen 8085 default_server;
        root /var/www/html;
        index index.html;

        # Wisp server bundled in the image (docker-entrypoint.sh). The browser terminal opens its
        # network through it on the dashboard's own origin. It answers 502 when the server is off.
        location /wisp/ {
            access_log /dev/stdout wisp_no_query;
            if ($wisp_origin_allowed = 0) { return 403; }
            # The query (the access token, checked by the gateway) stops here: wisp-js tells Wisp from
            # wsproxy by whether the request URL ends in "/", and the token has no use behind nginx.
            rewrite ^/wisp/(.*)$ /$1? break;
            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        # The terminal's files (the Debian image, read with Range requests): a missing one is a 404,
        # never the app's index.html.
        location /terminal/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri.html $uri/ /index.html =404;
        }
    }
}
